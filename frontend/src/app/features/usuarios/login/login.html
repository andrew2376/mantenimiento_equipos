<div class="login-container">

  <div class="login-card">

    <h1>Iniciar sesión</h1>

    <p class="subtitulo">
      Mantenimiento de Equipos
    </p>

    <form (ngSubmit)="iniciarSesion()">

      <div class="campo">
        <label for="correo">
          Correo electrónico
        </label>

        <input
          id="correo"
          type="email"
          name="correo"
          [(ngModel)]="correo"
          placeholder="Ingrese su correo"
          autocomplete="email"
        />
      </div>

      <div class="campo">
        <label for="clave">
          Contraseña
        </label>

        <input
          id="clave"
          type="password"
          name="clave"
          [(ngModel)]="clave"
          placeholder="Ingrese su contraseña"
          autocomplete="current-password"
        />
      </div>

      @if (error) {
        <div class="error">
          {{ error }}
        </div>
      }

      <button
        type="submit"
        [disabled]="cargando"
      >
        @if (cargando) {
          Iniciando sesión...
        } @else {
          Iniciar sesión
        }
      </button>

    </form>

  </div>

</div>
