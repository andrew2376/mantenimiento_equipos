<div class="modal-overlay">

  <div class="modal">

    <div class="modal-header">

      <div>

        <h2>

          @if (ticketEditar) {

            Editar ticket

          } @else {

            Nuevo ticket

          }

        </h2>

        <p>

          @if (ticketEditar) {

            Actualiza la información de la solicitud de mantenimiento

          } @else {

            Registra una nueva solicitud de mantenimiento

          }

        </p>

      </div>

      <button
        type="button"
        class="btn-cerrar modal-close"
        title="Cerrar"
        (click)="cancelar()"
      >

        ×

      </button>

    </div>


    @if (error) {

      <div class="mensaje error">

        {{ error }}

      </div>

    }


    <form
      (ngSubmit)="guardar()"
    >

      <div class="form-group">

        <label for="titulo">
          Título
        </label>

        <input
          id="titulo"
          type="text"
          name="titulo"
          [(ngModel)]="titulo"
          placeholder="Ej. Equipo no enciende"
          maxlength="150"
          required
        />

      </div>


      <div class="form-group">

        <label for="descripcion">
          Descripción
        </label>

        <textarea
          id="descripcion"
          name="descripcion"
          [(ngModel)]="descripcion"
          placeholder="Describe el problema del equipo..."
          rows="4"
          required
        ></textarea>

      </div>


      <div class="form-group">

        <label for="prioridad">
          Prioridad
        </label>

        <select
          id="prioridad"
          name="prioridad"
          [(ngModel)]="prioridad"
        >

          <option value="BAJA">
            Baja
          </option>

          <option value="MEDIA">
            Media
          </option>

          <option value="ALTA">
            Alta
          </option>

          <option value="CRITICA">
            Crítica
          </option>

        </select>

      </div>


      @if (ticketEditar) {

        <div class="form-group">

          <label for="estado">
            Estado
          </label>

          <select
            id="estado"
            name="estado"
            [(ngModel)]="estado"
          >

            <option value="ABIERTO">
              Abierto
            </option>

            <option value="ASIGNADO">
              Asignado
            </option>

            <option value="EN_DIAGNOSTICO">
              En diagnóstico
            </option>

            <option value="EN_MANTENIMIENTO">
              En mantenimiento
            </option>

            <option value="RESUELTO">
              Resuelto
            </option>

            <option value="CERRADO">
              Cerrado
            </option>

            <option value="CANCELADO">
              Cancelado
            </option>

          </select>

        </div>

      }


      <div class="form-group">

        <label for="equipo">
          Equipo
        </label>

        <select
          id="equipo"
          name="equipo"
          [(ngModel)]="equipoId"
          required
        >

          <option [ngValue]="null">
            Selecciona un equipo
          </option>

          @for (
            equipo of equipos;
            track equipo.id
          ) {

            <option [ngValue]="equipo.id">

              {{ equipo.codigoInventario }}
              -
              {{ equipo.nombre }}

            </option>

          }

        </select>

      </div>


      <div class="form-group">

        <label for="solicitante">
          Solicitante
        </label>

        <select
          id="solicitante"
          name="solicitante"
          [(ngModel)]="solicitanteId"
          required
        >

          <option [ngValue]="null">
            Selecciona el solicitante
          </option>

          @for (
            usuario of usuarios;
            track usuario.id
          ) {

            <option [ngValue]="usuario.id">

              {{ usuario.nombre }}

            </option>

          }

        </select>

      </div>


      <div class="modal-actions">

        <button
          type="button"
          class="btn-cancelar"
          (click)="cancelar()"
          [disabled]="guardando"
        >

          Cancelar

        </button>


        <button
          type="submit"
          class="btn-guardar"
          [disabled]="guardando"
        >

          @if (guardando) {

            Guardando...

          } @else {

            @if (ticketEditar) {

              Actualizar ticket

            } @else {

              Guardar ticket

            }

          }

        </button>

      </div>

    </form>

  </div>

</div>
