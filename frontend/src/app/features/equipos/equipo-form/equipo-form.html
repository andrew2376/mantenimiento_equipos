<div class="modal-overlay">

  <div class="modal">

    <!-- Encabezado -->
    <div class="modal-header">

      <div>
        <h2>Nuevo equipo</h2>
        <p>Registra un nuevo equipo de cómputo</p>
      </div>

      <button
        type="button"
        class="modal-close"
        aria-label="Cerrar"
        (click)="cerrarFormulario()"
      >
        ×
      </button>

    </div>


    <!-- Formulario -->
    <form (ngSubmit)="guardarEquipo()">

      <div class="form-grid">

        <!-- Código -->
        <div class="form-group">

          <label for="codigoInventario">
            Código de inventario
            <span>*</span>
          </label>

          <input
            id="codigoInventario"
            name="codigoInventario"
            type="text"
            [(ngModel)]="codigoInventario"
            placeholder="Ej. EQ-003"
          />

        </div>


        <!-- Nombre -->
        <div class="form-group">

          <label for="nombre">
            Nombre del equipo
            <span>*</span>
          </label>

          <input
            id="nombre"
            name="nombre"
            type="text"
            [(ngModel)]="nombre"
            placeholder="Ej. Computador de escritorio"
          />

        </div>


        <!-- Tipo -->
        <div class="form-group">

          <label for="tipo">
            Tipo de equipo
            <span>*</span>
          </label>

          <select
            id="tipo"
            name="tipo"
            [(ngModel)]="tipo"
          >

            <option value="">
              Selecciona un tipo
            </option>

            <option value="PORTATIL">
              Portátil
            </option>

            <option value="ESCRITORIO">
              Escritorio
            </option>

            <option value="SERVIDOR">
              Servidor
            </option>

            <option value="TODO_EN_UNO">
              Todo en uno
            </option>

            <option value="OTRO">
              Otro
            </option>

          </select>

        </div>


        <!-- Marca -->
        <div class="form-group">

          <label for="marca">
            Marca
            <span>*</span>
          </label>

          <input
            id="marca"
            name="marca"
            type="text"
            [(ngModel)]="marca"
            placeholder="Ej. Dell"
          />

        </div>


        <!-- Modelo -->
        <div class="form-group">

          <label for="modelo">
            Modelo
          </label>

          <input
            id="modelo"
            name="modelo"
            type="text"
            [(ngModel)]="modelo"
            placeholder="Ej. OptiPlex 7090"
          />

        </div>


        <!-- Número de serie -->
        <div class="form-group">

          <label for="numeroSerie">
            Número de serie
          </label>

          <input
            id="numeroSerie"
            name="numeroSerie"
            type="text"
            [(ngModel)]="numeroSerie"
            placeholder="Ej. SN-003-2026"
          />

        </div>


        <!-- Ubicación -->
        <div class="form-group form-group-full">

          <label for="ubicacion">
            Ubicación
            <span>*</span>
          </label>

          <input
            id="ubicacion"
            name="ubicacion"
            type="text"
            [(ngModel)]="ubicacion"
            placeholder="Ej. Laboratorio 1"
          />

        </div>

      </div>


      <!-- Error -->
      @if (error) {

        <div class="form-error">
          {{ error }}
        </div>

      }


      <!-- Acciones -->
      <div class="modal-actions">

        <button
          type="button"
          class="btn-cancelar"
          (click)="cerrarFormulario()"
          [disabled]="guardando"
        >
          Cancelar
        </button>


        <button
          type="submit"
          class="btn-guardar"
          [disabled]="guardando"
        >

          @if (guardando) {
            Guardando...
          } @else {
            Guardar equipo
          }

        </button>

      </div>

    </form>

  </div>

</div>
